<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>Auto Split-Screen Co-op</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4f0"/>
      <stop offset="1" stop-color="#cdeefb"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb33f"/>
      <stop offset="1" stop-color="#4a8a2a"/>
    </linearGradient>
    <linearGradient id="viewL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8f5"/>
      <stop offset="0.62" stop-color="#d9f2fb"/>
      <stop offset="0.62" stop-color="#7cbf47"/>
      <stop offset="1" stop-color="#5a9b33"/>
    </linearGradient>
    <linearGradient id="viewR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c98a"/>
      <stop offset="0.62" stop-color="#fbe3b8"/>
      <stop offset="0.62" stop-color="#8cc552"/>
      <stop offset="1" stop-color="#66a23a"/>
    </linearGradient>
    <g id="farmer">
      <!-- body -->
      <rect x="-34" y="10" width="68" height="78" rx="18" fill="currentColor"/>
      <!-- head -->
      <circle cx="0" cy="-14" r="26" fill="#f2c79b"/>
      <!-- straw hat -->
      <ellipse cx="0" cy="-30" rx="46" ry="10" fill="#e8b64a" stroke="#9a6a1e" stroke-width="3"/>
      <path d="M-24 -30 Q-24 -60 0 -60 Q24 -60 24 -30 Z" fill="#e8b64a" stroke="#9a6a1e" stroke-width="3"/>
      <rect x="-24" y="-38" width="48" height="7" fill="#c0392b"/>
      <!-- eyes -->
      <circle cx="-9" cy="-12" r="3.5" fill="#3b2414"/>
      <circle cx="9" cy="-12" r="3.5" fill="#3b2414"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="1150" cy="110" r="58" fill="#ffe58a"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="180" cy="90" rx="80" ry="26"/>
    <ellipse cx="235" cy="74" rx="50" ry="26"/>
    <ellipse cx="900" cy="70" rx="70" ry="22"/>
    <ellipse cx="950" cy="56" rx="42" ry="22"/>
  </g>
  <path d="M0 560 Q320 500 640 548 T1280 530 V720 H0 Z" fill="url(#grass)"/>
  <!-- fence -->
  <g fill="#b07a45" stroke="#6b4423" stroke-width="3">
    <rect x="0" y="598" width="1280" height="12"/>
    <rect x="0" y="630" width="1280" height="12"/>
    <rect x="40" y="580" width="18" height="80"/>
    <rect x="200" y="580" width="18" height="80"/>
    <rect x="360" y="580" width="18" height="80"/>
    <rect x="1062" y="580" width="18" height="80"/>
    <rect x="1222" y="580" width="18" height="80"/>
  </g>

  <!-- title sign (wood) -->
  <g>
    <rect x="70" y="160" width="560" height="290" rx="20" fill="#8b5a2b" stroke="#4e2f14" stroke-width="6"/>
    <rect x="88" y="178" width="524" height="254" rx="12" fill="#c48a4e" stroke="#6b4423" stroke-width="3"/>
    <g stroke="#a8743f" stroke-width="2" opacity="0.6">
      <line x1="100" y1="240" x2="600" y2="240"/>
      <line x1="100" y1="305" x2="600" y2="305"/>
      <line x1="100" y1="370" x2="600" y2="370"/>
    </g>
    <g font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', Arial, sans-serif" font-weight="bold" text-anchor="middle">
      <text x="350" y="255" font-size="70" fill="#3b2414" stroke="#fff3d6" stroke-width="10" paint-order="stroke" stroke-linejoin="round">Auto</text>
      <text x="350" y="335" font-size="62" fill="#3b2414" stroke="#fff3d6" stroke-width="10" paint-order="stroke" stroke-linejoin="round">Split-Screen</text>
      <text x="350" y="410" font-size="64" fill="#2f6b1f" stroke="#fff3d6" stroke-width="10" paint-order="stroke" stroke-linejoin="round">Co-op</text>
    </g>
  </g>
  <!-- subtitle ribbon -->
  <g>
    <rect x="80" y="472" width="540" height="64" rx="32" fill="#2f6b1f" stroke="#1d4613" stroke-width="4"/>
    <text x="350" y="513" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff8e1" text-anchor="middle">Player 2 joins automatically</text>
  </g>

  <!-- split screen monitor -->
  <g>
    <rect x="690" y="150" width="520" height="340" rx="22" fill="#5a3a1e" stroke="#3b2414" stroke-width="6"/>
    <rect x="712" y="172" width="236" height="296" rx="8" fill="url(#viewL)"/>
    <rect x="952" y="172" width="236" height="296" rx="8" fill="url(#viewR)"/>
    <rect x="946" y="166" width="8" height="308" fill="#fff8e1"/>
    <!-- stand -->
    <rect x="910" y="490" width="80" height="44" fill="#5a3a1e" stroke="#3b2414" stroke-width="5"/>
    <rect x="850" y="530" width="200" height="22" rx="8" fill="#5a3a1e" stroke="#3b2414" stroke-width="5"/>

    <!-- left farmer (P1) -->
    <use href="#farmer" x="830" y="340" color="#3d7cc9"/>
    <rect x="790" y="196" width="80" height="40" rx="10" fill="#3d7cc9" stroke="#ffffff" stroke-width="3"/>
    <text x="830" y="226" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">P1</text>

    <!-- right farmer (P2) -->
    <use href="#farmer" x="1070" y="340" color="#c94a3d"/>
    <rect x="1030" y="196" width="80" height="40" rx="10" fill="#c94a3d" stroke="#ffffff" stroke-width="3"/>
    <text x="1070" y="226" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">P2</text>
    <!-- join burst -->
    <circle cx="1150" cy="260" r="22" fill="#ffd23f" stroke="#9a6a1e" stroke-width="3"/>
    <path d="M1150 248 V272 M1138 260 H1162" stroke="#3b2414" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
